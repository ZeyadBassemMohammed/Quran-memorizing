<script>

/* ===== Quran structure: Madinah Mushaf (604 pages), Hafs. Surah START pages = constant table; verify against your mushaf.

const SN='الفاتحة|البقرة|آل عمران|النساء|المائدة|الأنعام|الأعراف|الأنفال|التوبة|يونس|هود|يوسف|الرعد|إبراهيم|الحجر|النحل|الإسراء|الكهف|مريم|طه|الأنبياء|الحج|المؤمنون|النور|الفرقان|الشعراء|النمل|القصص|العنكبوت|الروم|لقمان|السجدة|الأحزاب|سبأ|فاطر|يس|الصافات|ص|الزمر|غافر|فصلت|الشورى|الزخرف|الدخان|الجاثية|الأحقاف|محمد|الفتح|الحجرات|ق|الذاريات|الطور|النجم|القمر|الرحمن|الواقعة|الحديد|المجادلة|الحشر|الممتحنة|الصف|الجمعة|المنافقون|التغابن|الطلاق|التحريم|الملك|القلم|الحاقة|المعارج|نوح|الجن|المزمل|المدثر|القيامة|الإنسان|المرسلات|النبأ|النازعات|عبس|التكوير|الانفطار|المطففين|الانشقاق|البروج|الطارق|الأعلى|الغاشية|الفجر|البلد|الشمس|الليل|الضحى|الشرح|التين|العلق|القدر|البينة|الزلزلة|العاديات|القارعة|التكاثر|العصر|الهمزة|الفيل|قريش|الماعون|الكوثر|الكافرون|النصر|المسد|الإخلاص|الفلق|الناس'.split('|');
const SP=[1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,577,578,580,582,583,585,586,587,587,589,590,591,591,592,593,594,595,595,596,596,597,597,598,598,599,599,600,600,601,601,601,602,602,602,603,603,603,604,604,604];

const KEY='quranPlannerV1',APP='quran-planner',VER=3,U=4; /* U = planning units per page (quarter pages) */
const DEF={startPage:1,prior:'',timeMin:60,revCap:16,friMax:20,digits:'ar',theme:'light',motiv:true,friRecent:true,totalPages:604,lastBackup:0,name:'',memDays:[6,0,1,2,3,4],revDays:[5],amt:2,endPage:604,recentN:8,cycleWeeks:8,extraMax:2,weekStart:6,zoom:'md',hijri:true,pin:'',autoOld:true,sessOnly:false,tol:2,memMin:30,revMin:4,order:'fwd',wrap:true};
const CATS={new:'حفظ جديد',rec:'مراجعة الحفظ القريب',cur:'مراجعة السورة الحالية',g:'استدراك بعد الانقطاع',f:'مراجعة طويلة المدى',o:'مراجعة من القديم (تلقائية)',w:'مراجعة اختيارية لحفظ الأسبوع',z:'جلسة مراجعة',c:'جلسة'};

const catOf=k=>/^new/.test(k)?'new':/^[fgo]\d/.test(k)?k[0]:k.startsWith('z_')?'z':k.startsWith('c_')?'c':k;

let S=null,tab='home',selDate='',calM=null,storageOK=true,unlocked=false,migrated=false;const OP=new Set();

/* ---------- dates ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const N=x=>{x=String(x);return S.settings.digits==='ar'?x.replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫'):x};
const nu=()=>S.settings.digits==='ar'?'arab':'latn';
function gdate(D){try{return new Intl.DateTimeFormat('ar-EG-u-nu-'+nu(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(pd(D))}catch(e){return D}}
function hij(D){if(S.settings.hijri===false)return'';try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-'+nu(),{day:'numeric',month:'long',year:'numeric'}).format(pd(D))}catch(e){return''}}
const wsOf=D=>addD(D,-((pd(D).getDay()-S.settings.weekStart+7)%7));

/* ---------- state, migration, storage ---------- */
const valid=o=>o&&typeof o==='object'&&o.settings&&typeof o.settings==='object'&&o.tasks&&typeof o.tasks==='object'&&!Array.isArray(o.tasks);
function mk(o){o=o||{};const rs=o.settings||{},old=!o.u&&Object.keys(o).length>0;
 const t={v:VER,u:U,settings:{...DEF,...rs},tasks:o.tasks&&typeof o.tasks==='object'?o.tasks:{},plans:o.plans&&typeof o.plans==='object'?o.plans:{},ch:o.ch&&typeof o.ch==='object'?o.ch:{},owned:Array.isArray(o.owned)?o.owned:[],x:o.x&&typeof o.x==='object'?o.x:{},pri:o.pri&&typeof o.pri==='object'?o.pri:{},ss:Array.isArray(o.ss)?o.ss:[]};
 if(old){migrated=true;migrate(t,rs)}return t}
/* old data used half-page units: convert ranges to quarter units, turn weak/difficulty marks into the priority map */
function migrate(t,rs){t.pri={};const oldPg=k=>k[0]==='f'||k==='w';
 Object.keys(t.tasks).sort().forEach(d=>{const rec=t.tasks[d];if(!rec||typeof rec!=='object')return;for(const k in rec){const o=rec[k];if(!o||!Array.isArray(o.r))continue;const pg=oldPg(k);
  if(!pg)o.r=[o.r[0]*2,o.r[1]*2+1];
  const v=(o.weak||o.diff==='صعب')?3:o.diff==='متوسط'?2:o.diff==='سهل'?1:0;
  if(v){const a=pg?U*(o.r[0]-1):o.r[0],b=pg?U*o.r[1]-1:o.r[1];for(let u=a;u<=b;u++)t.pri[u]=v}}});
 t.settings.amt=(+rs.amt||1)*2;t.settings.revCap=(+rs.revCap||8)*2;t.settings.recentN=(rs.recentN!=null?+rs.recentN:4)*2}
function fixS(){S.x=S.x&&typeof S.x==='object'?S.x:{};S.x.pd=Array.isArray(S.x.pd)?S.x.pd:[];S.x.sd=Array.isArray(S.x.sd)?S.x.sd:[];S.x.pb=Math.max(0,+S.x.pb||0);
 if(!S.pri||typeof S.pri!=='object')S.pri={};S.ss=(Array.isArray(S.ss)?S.ss:[]).filter(x=>x&&typeof x.id==='string');
 S.ss.forEach(x=>{x.name=String(x.name||'جلسة').slice(0,40);x.kind=['mem','rev','cus'].includes(x.kind)?x.kind:'mem';x.goal=Math.max(1,Math.min(5000,Math.round(+x.goal||4)));x.period=['day','week','month','year'].includes(x.period)?x.period:'week';x.days=Array.isArray(x.days)?[...new Set(x.days.map(Number).filter(d=>d>=0&&d<=6))]:[6];x.range=Array.isArray(x.range)?[Math.max(0,Math.round(+x.range[0]||0)),Math.max(0,Math.round(+x.range[1]||0))]:[0,0];x.text=String(x.text||'').slice(0,100);x.active=x.active!==false});
 const s=S.settings,c=(v,a,b,d)=>{v=Math.round(+v);return isNaN(v)?d:Math.min(b,Math.max(a,v))},dl=(a,d)=>Array.isArray(a)?[...new Set(a.map(Number).filter(x=>x>=0&&x<=6))]:d;
 s.totalPages=c(s.totalPages,100,700,604);s.startPage=c(s.startPage,1,s.totalPages,1);s.timeMin=c(s.timeMin,15,600,60);s.friMax=c(s.friMax,2,200,20);
 s.memDays=dl(s.memDays,[6,0,1,2,3,4]);s.revDays=dl(s.revDays,[5]);s.amt=c(s.amt,1,80,2);s.revCap=c(s.revCap,1,80,16);s.recentN=c(s.recentN,0,80,8);
 s.endPage=c(s.endPage,s.startPage,s.totalPages,s.totalPages);s.cycleWeeks=c(s.cycleWeeks,1,52,8);s.extraMax=c(s.extraMax,0,10,2);delete s.gapDays;delete s.gapPauseNew;delete S.x.rv;s.tol=c(s.tol,0,5,2);s.order=['fwd','rsur'].includes(s.order)?s.order:'fwd';s.wrap=s.wrap!==false;s.memMin=c(s.memMin,5,240,30);s.revMin=c(s.revMin,1,60,4);
 s.weekStart=[6,0,1].includes(+s.weekStart)?+s.weekStart:6;s.zoom=['sm','md','lg'].includes(s.zoom)?s.zoom:'md';s.name=String(s.name||'').slice(0,30);s.pin=typeof s.pin==='string'?s.pin:'';
 s.digits=s.digits==='en'?'en':'ar';s.theme=s.theme==='dark'?'dark':'light';s.prior=String(s.prior||'');s.autoOld=s.autoOld!==false;s.sessOnly=!!s.sessOnly}
function load(){let r=null;S=mk({});try{r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(valid(o)){if(!o.u)try{localStorage.setItem(KEY+'_pre4',r)}catch(e){}S=mk(o)}}}
 catch(e){try{if(r)localStorage.setItem(KEY+'_corrupt',r)}catch(x){}storageOK=false}fixS();if(migrated)save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}

/* ---------- model: unit u = quarter page (0-based); page = floor(u/U)+1 ---------- */
const TP=()=>S.settings.totalPages,TH=()=>U*TP(),LIM=()=>U*S.settings.endPage,pgOf=u=>Math.floor(u/U)+1,pu=(a,b)=>[U*(a-1),U*b-1];
function priorUnits(){const s=new Set(),tp=TP();S.settings.prior.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).split(/[,،\n]+/).forEach(t=>{const m=t.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);if(!m)return;let a=+m[1],b=+(m[2]||m[1]);if(a>b)[a,b]=[b,a];a=Math.max(a,1);b=Math.min(b,tp);for(let u=U*(a-1);u<=U*b-1;u++)s.add(u)});return s}
function memSet(ex){const s=priorUnits();for(const d in S.tasks){if(d===ex)continue;for(const k in S.tasks[d]){const t=S.tasks[d][k];if(/^new/.test(k)&&t.done&&t.r)for(let u=t.r[0];u<=t.r[1];u++)s.add(u)}}return s}
/* where the next new memorization starts. 'fwd': from the start page forward (then, if the plan covers the whole Quran and wrap is on, from the first unmemorized unit);
   'rsur': surah by surah from the last to the first (each surah read forward), wrapping to the top when the bottom is done */
function nextInfo(ms){const s=S.settings;
 if(s.order==='rsur'&&TP()===604){const k0=surIdx(Math.max(1,s.startPage));
  for(let n=0;n<114;n++){let k=k0-n;if(k<0){if(!s.wrap)break;k+=114}
   const lo=U*(SP[k]-1),hi=Math.min(TH()-1,U*Math.max(SP[k],(SP[k+1]||605)-1)-1);for(let u=lo;u<=hi;u++)if(!ms.has(u))return{u,max:hi}}
  return null}
 let u=U*(s.startPage-1);while(ms.has(u))u++;
 if(u<LIM())return{u,max:LIM()-1};
 if(s.wrap&&s.endPage>=s.totalPages){u=0;while(ms.has(u))u++;if(u<TH())return{u,max:TH()-1}}
 return null}
const ptr=ms=>{const i=nextInfo(ms);return i?i.u:-1};
/* the most recent finished memorization before day D: revision of "recent" and "current surah" follows it, whatever the order */
function anchorOf(D){let best=null,bd='';for(const d in S.tasks){if(d>=D)continue;for(const k in S.tasks[d]){const o=S.tasks[d][k];if(/^new/.test(k)&&o.done&&o.r&&(d>bd||(d===bd&&o.r[1]>best[1]))){best=o.r;bd=d}}}return best}
const fullPage=(ms,p)=>{for(let u=U*(p-1);u<U*p;u++)if(!ms.has(u))return false;return true};
const pagesMem=ms=>{let n=0;ms.forEach(u=>{if(u>=0&&u<TH())n++});return Math.round(n/U*100)/100};
const surIdx=p=>{let k=0;SP.forEach((s,i)=>{if(s<=p)k=i});return k};

const QN=['الربع الأول','الربع الثاني','الربع الثالث','الربع الرابع'];

const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function pickT(arr,key,k){const R=rng(hash(key)),a=arr.map((x,i)=>i).filter(i=>!arr[i].ap||arr[i].ap());for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k).map(i=>arr[i])}
const lvl=()=>Math.min(3,Math.round((1+Math.floor(pagesMem(memSet())/40)*0.2)*10)/10);
function schedCount(s,e,m){let n=0;const memOnly=['ntasks','cur','rec'].includes(m);for(let d=s;d<=e;d=addD(d,1)){const w=pd(d).getDay();if(S.settings.memDays.includes(w)||(!memOnly&&S.settings.revDays.includes(w)))n++}return n}
function chDefs(){const D=today(),w=wsOf(D),we=addD(w,6),t=pd(D),ms_=iso(new Date(t.getFullYear(),t.getMonth(),1)),me=iso(new Date(t.getFullYear(),t.getMonth()+1,0)),mn=new Intl.DateTimeFormat('ar-EG-u-nu-'+nu(),{month:'long'}).format(t),lf=lvl();
 const mk_=(T,s,e)=>{let n=Math.max(1,Math.round(T.b*lf));if(['days','streak','ntasks','cur','rec'].includes(T.m))n=Math.min(n,Math.max(1,schedCount(s,e,T.m)));return{id:T.id+'@'+s,t:T.t,d:T.d(n),s,e,m:T.m,n,xp:Math.round(T.x*lf)}};
 return[...pickT(CW,'w'+w,4).map(T=>mk_(T,w,we)),...pickT(CM,'m'+ms_,3).map(T=>{const c=mk_(T,ms_,me);c.t+=' — '+mn;return c})]}
function chProg(c,from){const a=from>c.s?from:c.s,T=today(),e=c.e<T?c.e:T;let n=0;
 if(c.m==='streak'){let run=0,best=0;for(let d=a;d<=e;d=addD(d,1)){if(!sched(d))continue;if(st(d)==='full'){run++;if(run>best)best=run}else run=0}return best}
 if(c.m==='days'){for(let d=a;d<=e;d=addD(d,1))if(st(d)==='full')n++;return n}
 if(c.m==='sdq')return S.x.sd.filter(d=>d>=a&&d<=c.e).length;
 for(const d in S.tasks){if(d<a||d>c.e)continue;const r=S.tasks[d];for(const k in r){const o=r[k];if(c.m==='rated'){if(o.rv>0)n++;continue}if(!o.done||!o.r)continue;const ct=catOf(k);
  if(c.m==='pages'&&ct==='new')n+=(o.r[1]-o.r[0]+1)/U;else if(c.m==='rev'&&['rec','cur','f','g','o','w','z'].includes(ct))n++;else if(c.m==='fpages'&&['f','g','o'].includes(ct))n+=o.r[1]-o.r[0]+1;
  else if(c.m==='ext'&&/^new\d/.test(k))n++;else if(c.m==='cur'&&ct==='cur')n++;else if(c.m==='rec'&&ct==='rec')n++;else if(c.m==='ntasks'&&ct==='new'&&!/^new\d/.test(k))n++}}return n}
function chList(){const L=[],seen={};for(const id in S.ch){const c=S.ch[id];seen[id]=1;if(c.st==='acc'){const p=chProg(c,c.from);L.push({...c,p,acc:true,done:p>=c.n,exp:c.e<today()&&p<c.n})}else if(c.e>=today())L.push({...c,p:0,dec:true})}
 chDefs().forEach(c=>{if(!seen[c.id])L.push({...c,p:0})});return L}

 `<div class="card mut">تتغيّر التحديات كل أسبوع وكل شهر، من مجموعة تضم أكثر من ${N(CW.length+CM.length)} تحديًا بأنواع مختلفة، وتكبر أهدافها وجوائزها مع حفظك. النقاط: حفظ جديد ${N(10)}، مراجعة قريبة ${N(4)}، سورة حالية ${N(6)}، مراجعة طويلة أو استدراك ${N(6)}، مراجعة قديمة ${N(5)}، ويوم مكتمل +${N(15)}، وجائزة كل تحدٍّ. يُحتسب التحدي من لحظة قبوله. إلغاء تعليم مهمة ينقص نقاطها.</div>`}

const lockView=()=>`<main><h1>التطبيق مقفل</h1><div class="card"><label>كلمة السر<input id="pw" type="password" inputmode="numeric" autocomplete="off"></label><button class="b" data-a="unlock">فتح</button><p class="mut" id="lm"></p><button class="b d" data-a="forgot">نسيت كلمة السر (يحذف بيانات هذا الجهاز)</button></div></main>`;

/* ---------- streak bar (top of every page) ---------- */
function streakTxt(n){return n===0?'ابدأ سلسلتك اليوم':n===1?'سلسلتك: يوم واحد':n===2?'سلسلتك: يومان':n<=10?`سلسلتك: ${N(n)} أيام`:`سلسلتك: ${N(n)} يومًا`}
function streakBar(){const n=streak(),fz=S.x.pd.includes(today());return `<div class="sbar"><div class="spill ${fz?'fz':''}" aria-label="${esc(streakTxt(n))}"><span class="sic">${fz?'❄':'🔥'}</span><b>${streakTxt(n)}</b>${fz?'<small>مجمّدة بتصريح راحة</small>':''}</div></div>`}

/* ---------- render ---------- */
function render(){const app=document.getElementById('app');document.documentElement.dataset.theme=S.settings.theme;document.documentElement.dataset.pal=(S.owned.includes(S.x.pal)&&PAL[S.x.pal])?PAL[S.x.pal]:'';if(!selDate)selDate=today();
 if(S.settings.pin&&!unlocked){app.innerHTML=lockView();return}
 const V={home,today:dayView,cal:calView,rev:reviewView,ss:ssView,ch:chView,shop:shopView,stats:statsView,set:settingsView}[tab]();
 const T=[['home','⌂','الرئيسية'],['today','☑','خطة اليوم'],['cal','▦','التقويم'],['rev','↺','المراجعة'],['ss','☰','الجلسات'],['ch','★','التحديات'],['shop','✦','المتجر'],['stats','▥','الإحصائيات'],['set','⚙','الإعدادات']],o=document.querySelector('nav'),sl=o?o.scrollLeft:0;
 app.innerHTML=streakBar()+`<main style="zoom:${{sm:.88,md:1,lg:1.12}[S.settings.zoom]}">${V}</main><nav>${T.map(x=>`<button class="${tab===x[0]?'on':''}" data-a="tab" data-t="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`;
 const n=document.querySelector('nav');if(n)n.scrollLeft=sl}

/* ---------- backup / export ---------- */
async function exp(){const txt=JSON.stringify({app:APP,version:VER,u:U,exported:new Date().toISOString(),settings:S.settings,tasks:S.tasks,plans:S.plans,ch:S.ch,owned:S.owned,x:S.x,pri:S.pri,ss:S.ss},null,1),name='quran-planner-backup-'+today()+'.json';
 try{const f=new File([txt],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
  else{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
  S.settings.lastBackup=Date.now();save();render();toast('تم تجهيز ملف النسخة الاحتياطية. تأكد أنه حُفظ في «الملفات» أو iCloud.')}
 catch(e){toast(e&&e.name==='AbortError'?'أُلغيت المشاركة ولم تُنشأ نسخة.':'تعذّر إنشاء النسخة الاحتياطية.')}}
function parseBackup(txt){let o;try{o=JSON.parse(txt)}catch(e){return null}
 if(!o||o.app!==APP||typeof o.version!=='number'||o.version>VER||!valid(o)||(o.u&&o.u!==U))return null;
 for(const d in o.tasks)if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!o.tasks[d]||typeof o.tasks[d]!=='object')return null;
 if(o.pri&&typeof o.pri!=='object'||o.ss&&!Array.isArray(o.ss))return null;return o}
function imp(f){if(!f)return;const r=new FileReader();r.onerror=()=>toast('تعذّرت قراءة الملف.');
 r.onload=()=>{const o=parseBackup(r.result);if(!o){toast('الملف غير صالح أو من إصدار غير متوافق. اختر ملف نسخة احتياطية صدّرته من هذا التطبيق.');return}
  if(!confirm('سيتم استبدال تقدّمك الحالي بالنسخة المستوردة. هل تريد المتابعة؟'))return;
  S=mk(o);fixS();save();render();toast('تم استيراد النسخة الاحتياطية بنجاح.')};r.readAsText(f)}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',R=[['التاريخ','اليوم','الفئة','النطاق','الحالة','ملاحظات','التقييم','']];
 Object.keys(S.tasks).sort().forEach(d=>{for(const k in S.tasks[d]){const o=S.tasks[d][k];if(!o.r)continue;const c=catOf(k);R.push([d,WD[pd(d).getDay()],ttl(k),c==='c'?'':(isPg(k)?rlp(o.r[0],o.r[1]):rl(o.r[0],o.r[1])).t,o.done?'مكتملة':'غير مكتملة',o.note,o.rv?RL[o.rv]:'',''])}});
 const u=URL.createObjectURL(new Blob(['\ufeff'+R.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='quran-planner-history-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('تم تجهيز ملف السجل (CSV).')}
function prt(){const ms=memSet(),pg=pagesMem(ms),sv=surahStats(ms),c=counts();
 document.getElementById('print').innerHTML=`<h1>تقرير تقدّم حفظ القرآن</h1><p>${gdate(today())}</p><table><tr><th>الصفحات المحفوظة</th><td>${N(pg)} من ${N(TP())}</td></tr><tr><th>مهام الحفظ المكتملة</th><td>${N(c.nw)}</td></tr><tr><th>مهام المراجعة المكتملة</th><td>${N(c.rv)}</td></tr><tr><th>سور بدأتها / أكملتها</th><td>${N(sv.started)} / ${N(sv.done)}</td></tr><tr><th>أيام متتالية</th><td>${N(streak())}</td></tr></table>`;window.print()}

/* ---------- events ---------- */
const RNG={startPage:[1,()=>TP()],endPage:[()=>S.settings.startPage,()=>TP()],totalPages:[100,700],timeMin:[15,600],memMin:[5,240],revMin:[1,60],friMax:[2,200],cycleWeeks:[1,52],extraMax:[0,10],tol:[0,5]};
const rv_=x=>typeof x==='function'?x():x;
function updPrev(){const e=document.getElementById('liveprev');if(e&&tab==='set')e.innerHTML=previewH()}
/* commit=false while typing: apply only valid in-range numbers; commit=true (blur/select/checkbox): clamp, save, re-render */
function setS(t,commit){const k=t.dataset.s,s=S.settings;let v=t.type==='checkbox'?t.checked:t.value;
 if(t.type==='number'){if(v===''||isNaN(+v)){if(!commit)return;v=s[k]}else{v=Math.round(+v);const r=RNG[k];if(r){const lo=rv_(r[0]),hi=rv_(r[1]);if(!commit&&(v<lo||v>hi))return;v=Math.min(hi,Math.max(lo,v))}}}
 if(k==='totalPages'){const wasEnd=s.endPage>=s.totalPages;s[k]=v;if(wasEnd)s.endPage=v}else s[k]=v;
 fixS();save();updPrev();if(commit)render()}
function setSS(t,rr){const x=S.ss.find(y=>y.id===t.dataset.ss);if(!x)return;const f=t.dataset.f,v=t.type==='checkbox'?t.checked:t.value;
 if(f==='goalp'){const n=parseFloat(v);if(isNaN(n)||n<=0){if(rr)render();return}x.goal=Math.max(1,Math.round(n*U))}
 else if(f==='r0'||f==='r1'){const n=Math.round(+v);if(isNaN(n)){if(rr)render();return}x.range[f==='r0'?0:1]=Math.max(0,n)}
 else x[f]=v;fixS();save();if(rr)render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;const a=b.dataset.a;
 if(a==='tab'){tab=b.dataset.t;if(tab==='today')selDate=selDate||today();window.scrollTo(0,0);render()}
 else if(a==='tog')tog(b.dataset.d,b.dataset.k);
 else if(a==='day'){const n=+b.dataset.n;selDate=n?addD(selDate,-n):today();render()}
 else if(a==='goto'){selDate=b.dataset.d;tab='today';window.scrollTo(0,0);render()}
 else if(a==='cal'){if(!calM){const t=new Date();calM={y:t.getFullYear(),m:t.getMonth()}}const d=new Date(calM.y,calM.m-(+b.dataset.n),1);calM={y:d.getFullYear(),m:d.getMonth()};render()}
 else if(a==='dayT'){const A=S.settings[b.dataset.k],n=+b.dataset.d,i=A.indexOf(n);if(i>=0)A.splice(i,1);else A.push(n);fixS();save();render()}
 else if(a==='pri')setPri(b.dataset.d,b.dataset.k,+b.dataset.v);
 else if(a==='clrpri'){for(let u=+b.dataset.x;u<=+b.dataset.y;u++)delete S.pri[u];save();render()}
 else if(a==='ssadd'){S.ss.push({id:Math.random().toString(36).slice(2,7),name:'جلسة جديدة',kind:'mem',goal:4,period:'week',days:[6],range:[0,0],text:'',active:true});fixS();save();render()}
 else if(a==='ssdel'){if(confirm('حذف هذه الجلسة؟ لا يُحذف ما أتممتَه منها من سجلّك.')){S.ss=S.ss.filter(x=>x.id!==b.dataset.i);save();render()}}
 else if(a==='ssday'){const x=S.ss.find(y=>y.id===b.dataset.i);if(x){const n=+b.dataset.d,i=x.days.indexOf(n);if(i>=0)x.days.splice(i,1);else x.days.push(n);fixS();save();render()}}
 else if(a==='chacc'||a==='chdec'){const d=chList().find(x=>x.id===b.dataset.i);if(d){const c={id:d.id,t:d.t,d:d.d,s:d.s,e:d.e,m:d.m,n:d.n,xp:d.xp,st:a==='chacc'?'acc':'dec'};if(a==='chacc')c.from=today();S.ch[c.id]=c;save();render()}}
 else if(a==='buy'){const i=ITEMS.find(x=>x.id===b.dataset.i);if(i&&!S.owned.includes(i.id)&&xpBal()>=i.p&&(!i.q||i.q())){S.owned.push(i.id);save();render();toast('تم فتح الفائدة.')}}
 else if(a==='buypass'){if(xpBal()>=PASSP){S.x.pb++;save();render();toast('تم شراء تصريح راحة.')}}
 else if(a==='usepass'){const d=b.dataset.d;if(S.x.pb-S.x.pd.length>0&&!S.x.pd.includes(d)){S.x.pd.push(d);save();render()}}
 else if(a==='cancelpass'){S.x.pd=S.x.pd.filter(x=>x!==b.dataset.d);save();render()}
 else if(a==='pal'||a==='title'||a==='dua'){const i=b.dataset.i;if(!i||S.owned.includes(i)){S.x[a]=i;save();render()}}
 else if(a==='sdq'){const D=today(),i=S.x.sd.indexOf(D);if(i>=0)S.x.sd.splice(i,1);else S.x.sd.push(D);save();render()}
 else if(a==='setpin'){const v=document.getElementById('npw').value;if(v.length<4)return toast('كلمة السر ٤ خانات على الأقل.');if(!(window.crypto&&crypto.subtle))return toast('القفل غير مدعوم في هذا المتصفح.');hp(v).then(x=>{S.settings.pin=x;unlocked=true;save();render();toast('تم تعيين كلمة السر.')})}
 else if(a==='clrpin'){S.settings.pin='';save();render();toast('أُزيل القفل.')}
 else if(a==='unlock'){hp(document.getElementById('pw').value).then(x=>{if(x===S.settings.pin){unlocked=true;render()}else document.getElementById('lm').textContent='كلمة السر غير صحيحة.'})}
 else if(a==='forgot'){if(confirm('سيُحذف كل التقدم على هذا الجهاز ويُزال القفل (يمكنك الاستعادة من نسخة احتياطية). متابعة؟')){S=mk({});fixS();save();render()}}
 else if(a==='exp')exp();else if(a==='csv')csv();else if(a==='prt')prt();
 else if(a==='reset'){if(confirm('سيتم حذف كل التقدم والسجل نهائيًا. هل أنت متأكد؟')&&confirm('تأكيد أخير: هل صدّرتَ نسخة احتياطية وتريد الحذف؟')){S=mk({});fixS();save();render();toast('تم حذف كل التقدم.')}}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.a==='f')setDetail(t.dataset.d,t.dataset.k,t.dataset.f,t.value);
 else if(t.dataset.s&&(t.type==='number'||t.type==='text'))setS(t,false);
 else if(t.dataset.ss&&(t.type==='text'||t.type==='number'))setSS(t,false)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.a==='pickSur'){if(t.value!==''){S.settings.startPage=SP[+t.value];fixS();save();render()}return}
 if(t.dataset.a==='imp'){imp(t.files[0]);t.value='';return}
 if(t.dataset.a==='f'){setDetail(t.dataset.d,t.dataset.k,t.dataset.f,t.value);return}
 if(t.dataset.ss){setSS(t,true);return}
 if(t.dataset.s)setS(t,true)});
document.addEventListener('toggle',e=>{const t=e.target;if(t.dataset&&t.dataset.dk){if(t.open)OP.add(t.dataset.dk);else OP.delete(t.dataset.dk)}},true);
load();selDate=today();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
